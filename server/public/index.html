<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт «4 точки»</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --fg:#282828; --bg:#fafafa; --card:#fff; --line:#e2e2e2; --accent:#3b6fe0; --muted:#777; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#18181a; --card:#232326; --line:#3a3a3e; --muted:#999; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); padding:24px 16px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  .room { display:flex; gap:8px; margin:16px 0 24px; }
  .room input { flex:1; min-width:0; padding:8px 10px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .room button { padding:8px 14px; font:inherit; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .big { width:220px; height:220px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .big button { border:0; background:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .big button span { display:grid; place-items:center; border-radius:50%; background:var(--fg); width:22%; aspect-ratio:1; transition:width .15s;
    color:var(--card); font:700 38px/1 system-ui, sans-serif; overflow:hidden; }
  .big button span b { opacity:0; transition:opacity .15s; }
  .big button.on span { width:84%; }
  .big button.on span b { opacity:1; }
  .status { text-align:center; margin:12px 0 28px; min-height:1.4em; }
  h2 { font-size:16px; margin:20px 0 8px; }
  .grid { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { width:56px; height:56px; padding:4px; border:2px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer; }
  .opt.active { border-color:var(--accent); }
  .opt svg { width:100%; height:100%; fill:var(--fg); display:block; }
  .opt svg text { fill:var(--card); font:700 24px system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>Пульт «4 точки»</h1>
  <div class="muted">Выбери вариант — иконка расширения у владельца комнаты поменяется сразу.</div>

  <form class="room" id="roomForm">
    <input id="roomInput" placeholder="ID комнаты (есть в окне расширения)" autocomplete="off">
    <button>Подключиться</button>
  </form>

  <div class="big" id="big"></div>
  <div class="status muted" id="status">Укажи ID комнаты</div>

  <div id="variants"></div>
</main>
<script>
const CENTERS = [[28,28],[72,28],[28,72],[72,72]];
const LETTERS = ['A','B','C','D']; // верх-лево, верх-право, низ-лево, низ-право
// Буква пишется только в жирных (больших) кругах
const svg = s => `<svg viewBox="0 0 100 100">${CENTERS.map(([x,y],i) => s[i]==='1'
  ? `<circle cx="${x}" cy="${y}" r="19"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${LETTERS[i]}</text>`
  : `<circle cx="${x}" cy="${y}" r="9"/>`).join('')}</svg>`;

const big = document.getElementById('big');
const statusEl = document.getElementById('status');
const roomInput = document.getElementById('roomInput');
let room = new URLSearchParams(location.search).get('room') || '';
let state = '0000';
let ws, retry;

// Большой интерактивный квадрат
for (let i = 0; i < 4; i++) {
  const b = document.createElement('button');
  b.innerHTML = `<span><b>${LETTERS[i]}</b></span>`;
  b.title = ['Верх-лево','Верх-право','Низ-лево','Низ-право'][i];
  b.onclick = () => setState(state.slice(0,i) + (state[i]==='1'?'0':'1') + state.slice(i+1));
  big.appendChild(b);
}

// Все 16 вариантов, сгруппированные по числу жирных точек
const all = [...Array(16)].map((_, n) => n.toString(2).padStart(4,'0'));
const names = ['Без жирных','1 жирная','2 жирные','3 жирные','4 жирные'];
const variants = document.getElementById('variants');
for (let k = 0; k <= 4; k++) {
  variants.insertAdjacentHTML('beforeend', `<h2>${names[k]}</h2>`);
  const g = document.createElement('div'); g.className = 'grid';
  all.filter(s => [...s].filter(c => c==='1').length === k).forEach(s => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.s = s; b.innerHTML = svg(s); b.title = s;
    b.onclick = () => setState(s);
    g.appendChild(b);
  });
  variants.appendChild(g);
}

function render() {
  [...big.children].forEach((b, i) => b.classList.toggle('on', state[i]==='1'));
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('active', b.dataset.s === state));
}

async function setState(s) {
  if (!room) { statusEl.textContent = 'Сначала укажи ID комнаты'; return; }
  state = s; render();
  try {
    const r = await fetch(`api/state/${encodeURIComponent(room)}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ state: s })
    });
    if (!r.ok) throw new Error((await r.json()).error);
    statusEl.textContent = `Отправлено: ${s}`;
  } catch (e) { statusEl.textContent = 'Ошибка: ' + e.message; }
}

function connect() {
  clearTimeout(retry);
  if (ws) { ws.onclose = null; ws.close(); }
  if (!room) return;
  roomInput.value = room;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}${location.pathname.replace(/[^/]*$/, '')}ws?room=${encodeURIComponent(room)}`);
  ws.onopen = () => statusEl.textContent = `Комната «${room}» — подключено`;
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state' && m.state) { state = m.state; render(); } };
  ws.onclose = () => { statusEl.textContent = 'Нет связи, переподключаюсь…'; retry = setTimeout(connect, 2000); };
}

document.getElementById('roomForm').onsubmit = e => {
  e.preventDefault();
  room = roomInput.value.trim();
  history.replaceState(null, '', '?room=' + encodeURIComponent(room));
  connect();
};

render();
connect();
</script>
</body>
</html>
