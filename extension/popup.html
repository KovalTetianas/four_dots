<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#282828; --bg:#fff; --line:#e2e2e2; --accent:#3b6fe0; --muted:#777; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#232326; --line:#3a3a3e; --muted:#999; } }
  body { width:280px; margin:0; padding:14px; font:13px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#c33; }
  .dot.ok { background:#2a9d4b; }
  .big { width:120px; height:120px; margin:4px auto 12px; display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:12px; padding:10px; box-sizing:border-box; }
  .big button { border:0; background:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .big span { display:block; border-radius:50%; background:var(--fg); width:22%; aspect-ratio:1; transition:width .15s; }
  .big .on span { width:84%; }
  label { display:block; color:var(--muted); margin:8px 0 3px; }
  .row { display:flex; gap:6px; }
  input { flex:1; min-width:0; padding:5px 7px; font:inherit; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button.btn { padding:5px 10px; font:inherit; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .link { margin-top:12px; word-break:break-all; }
  a { color:var(--accent); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
  <h1><span class="dot" id="conn"></span>Четыре точки</h1>
  <div class="big" id="big"></div>

  <label>Сервер</label>
  <div class="row"><input id="server"><button class="btn primary" id="save">OK</button></div>

  <label>ID комнаты (отдай его другому человеку)</label>
  <div class="row"><input id="room"><button class="btn" id="copy">Копир.</button></div>

  <div class="link muted">Ссылка на пульт:<br><a id="link" target="_blank"></a></div>
  <script src="popup.js"></script>
</body>
</html>
